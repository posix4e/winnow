name: Peer census

# Dials every reachable node in the day's btcnodes snapshot with the wallet's
# own handshake and publishes the aggregate to docs/census/, which the site
# renders at /peer-census. Read-only against the network: version, verack,
# a short wait for feefilter, disconnect.
#
# Runs on the self-hosted macOS runner because PeerConnection is built on
# Network.framework. The per-node JSON lines are kept as a 14-day artifact
# rather than committed: btcnodes already publishes the per-IP view, and the
# repository only needs the aggregates to draw a trend.

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: peer-census
  cancel-in-progress: false

jobs:
  census:
    runs-on: [self-hosted, macos, x86_64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Fetch the day's snapshot
        run: |
          curl -sSL --max-time 120 -A "winnow-census/0.1 (+https://github.com/posix4e/winnow)" \
            -o snapshot.json "https://btcnodes.io/api/v1/snapshots/latest/"
          python3 -c 'import json,sys; d=json.load(open("snapshot.json")); print(len(d["nodes"]), "reachable nodes, tip", d.get("latest_height"))'

      - name: Build
        run: swift build -c release --product WinnowCensus

      - name: Dial every reachable node
        run: |
          .build/release/WinnowCensus --input snapshot.json --parallel 128 --timeout 8 \
            --out census.jsonl --summary-json summary.json | tee census-summary.txt

      - name: Publish the aggregate
        run: |
          scripts/census-publish summary.json
          git config user.name "winnow-census"
          git config user.email "census@users.noreply.github.com"
          git add docs/census
          git diff --cached --quiet && exit 0
          git commit -m "census: $(date -u +%Y-%m-%d)"
          git push origin HEAD:main

      - name: Keep the per-node detail for two weeks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: peer-census-${{ github.run_id }}
          path: |
            census.jsonl
            census-summary.txt
          retention-days: 14
