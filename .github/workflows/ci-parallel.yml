name: Parallel validation
on:
  workflow_call:
    inputs:
      fresh:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    outputs:
      reuse: ${{ steps.lookup.outputs.reuse }}
      fingerprint: ${{ steps.lookup.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_FRESH: ${{ inputs.fresh }}
        run: scripts/ci-validation lookup reused
      - if: steps.lookup.outputs.reuse == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reused-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: reused/
          retention-days: 7
  package:
    needs: evidence
    if: needs.evidence.outputs.reuse != 'true'
    runs-on: warp-macos-26-arm64-12x
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Restore compatible compilation products
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ${{ runner.temp }}/winnow-ci/results/production-build
          key: v2-17F113-arm64-package-${{ needs.evidence.outputs.fingerprint }}
      - name: package validation
        run: scripts/ci-lane package
      - name: Preserve package evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lane-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/winnow-ci/results/lanes/
            ${{ runner.temp }}/winnow-ci/results/*.log
            ${{ runner.temp }}/winnow-ci/results/app/
            ${{ runner.temp }}/winnow-ci/results/media/
            ${{ runner.temp }}/winnow-ci/results/fuzz/
            ${{ runner.temp }}/winnow-ci/results/supply-chain/
            !${{ runner.temp }}/winnow-ci/results/app/signet/
          if-no-files-found: error
          retention-days: 14
  build:
    needs: evidence
    if: needs.evidence.outputs.reuse != 'true'
    runs-on: warp-macos-26-arm64-12x
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Restore compatible compilation products
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/winnow-ci/build
          key: v2-17F113-arm64-build-${{ needs.evidence.outputs.fingerprint }}
      - name: build validation
        run: scripts/ci-lane build
      - name: Publish shared Debug products immediately
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lane-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/winnow-ci/results/debug-transfer/
          compression-level: 0
          retention-days: 1
      - name: Compile and inspect ARM64 Release
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          result="$RUNNER_TEMP/winnow-ci/results"
          xcodebuild -project WinnowApp.xcodeproj -scheme WinnowApp -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath "$result/release" -skipPackagePluginValidation -skipMacroValidation ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$result/app/release-build.log"
          scripts/check-dependencies --xcode "$result/release"
          scripts/check-swift-warnings "$result/app/release-build.log"
          scripts/verify-release-e2e-exclusion "$result/release/Build/Products/Release-iphonesimulator/WinnowApp.app"
          python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"winnow-ci/results/lanes/build.json"; r=json.loads(p.read_text()); r["release_inspected"]=True; p.write_text(json.dumps(r))'
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lane-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/winnow-ci/results/lanes/
            ${{ runner.temp }}/winnow-ci/results/*.log
            ${{ runner.temp }}/winnow-ci/results/app/
            ${{ runner.temp }}/winnow-ci/results/media/
            ${{ runner.temp }}/winnow-ci/results/fuzz/
            ${{ runner.temp }}/winnow-ci/results/supply-chain/
            !${{ runner.temp }}/winnow-ci/results/app/signet/
          if-no-files-found: error
          retention-days: 14
  units:
    needs: evidence
    if: needs.evidence.outputs.reuse != 'true'
    runs-on: warp-macos-26-arm64-12x
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: units validation
        run: scripts/ci-lane units
      - name: Preserve units evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lane-units-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/winnow-ci/results/lanes/
            ${{ runner.temp }}/winnow-ci/results/*.log
            ${{ runner.temp }}/winnow-ci/results/app/
            ${{ runner.temp }}/winnow-ci/results/media/
            ${{ runner.temp }}/winnow-ci/results/fuzz/
            ${{ runner.temp }}/winnow-ci/results/supply-chain/
            !${{ runner.temp }}/winnow-ci/results/app/signet/
          if-no-files-found: error
          retention-days: 14
  journey:
    needs: evidence
    if: needs.evidence.outputs.reuse != 'true'
    runs-on: warp-macos-26-arm64-12x
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Restore compatible compilation products
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
          key: v2-17F113-arm64-journey-${{ needs.evidence.outputs.fingerprint }}
      - name: journey validation
        run: scripts/ci-lane journey
      - name: Preserve journey evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lane-journey-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/winnow-ci/results/lanes/
            ${{ runner.temp }}/winnow-ci/results/*.log
            ${{ runner.temp }}/winnow-ci/results/app/
            ${{ runner.temp }}/winnow-ci/results/media/
            ${{ runner.temp }}/winnow-ci/results/fuzz/
            ${{ runner.temp }}/winnow-ci/results/supply-chain/
            !${{ runner.temp }}/winnow-ci/results/app/signet/
          if-no-files-found: error
          retention-days: 14
  validation:
    if: always()
    needs: [evidence, package, build, units, journey]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected lane
        env:
          REUSE: ${{ needs.evidence.outputs.reuse }}
          PLAN: ${{ needs.evidence.result }}
          PACKAGE: ${{ needs.package.result }}
          BUILD: ${{ needs.build.result }}
          UNITS: ${{ needs.units.result }}
          JOURNEY: ${{ needs.journey.result }}
        run: |
          [[ "$PLAN" == success ]]
          if [[ "$REUSE" == true ]]; then
            [[ "$PACKAGE:$BUILD:$UNITS:$JOURNEY" == skipped:skipped:skipped:skipped ]]
          else
            [[ "$PACKAGE:$BUILD:$UNITS:$JOURNEY" == success:success:success:success ]]
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Evidence regression tests
        run: python3 -m unittest discover -s scripts/tests
      - if: needs.evidence.outputs.reuse != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lane-@(package|build|units|journey)-${{ github.run_id }}-${{ github.run_attempt }}
          path: incoming
      - if: needs.evidence.outputs.reuse == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reused-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Assemble complete validation evidence
        env:
          GH_TOKEN: ${{ github.token }}
        if: needs.evidence.outputs.reuse != 'true'
        run: |
          mkdir -p evidence/lanes
          for lane in package build units journey; do
            cp "incoming/lane-$lane-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/lanes/$lane.json" evidence/lanes/
          done
          cp -R "incoming/lane-journey-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/media" evidence/media
          scripts/prepare-site-artifact --validate-media evidence/media
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > evidence/timing-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > evidence/timing-run.json
          scripts/ci-validation publish evidence
      - name: Verify complete wallet evidence
        run: |
          scripts/ci-validation verify evidence
          cat evidence/validation.json >> "$GITHUB_STEP_SUMMARY"
      - if: needs.evidence.outputs.reuse != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-${{ needs.evidence.outputs.fingerprint }}
          path: evidence/
          retention-days: 7
          overwrite: true
