name: TestFlight recovery

# Resume notes and the internal group for one uploaded build; never archives,
# uploads or requests external review.
on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Version as it appears in TestFlight, e.g. 0.2.0"
        required: true
      build_number:
        description: "Build number, i.e. the run number of the release that uploaded it"
        required: true

permissions:
  contents: read

env:
  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
  ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}

jobs:
  finish:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare signing credentials
        run: scripts/ci-sign.sh

      - name: TestFlight internal group
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/winnow-signing/AuthKey.p8
          TESTFLIGHT_MARKETING_VERSION: ${{ inputs.marketing_version }}
          TESTFLIGHT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          chmod +x scripts/testflight.sh
          scripts/testflight.sh wait-processing
          scripts/testflight.sh notes
          scripts/testflight.sh internal
          scripts/testflight.sh status || true
          # External beta review is never requested here either. A review
          # request cannot be withdrawn, so a person runs
          # `scripts/testflight.sh external` once the internal group has used
          # the build, as the runbook describes.

      - name: Remove App Store Connect key
        if: always()
        run: rm -f "${RUNNER_TEMP}/winnow-signing/AuthKey.p8"
