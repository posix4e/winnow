name: Node e2e (manual)

# Optional node-backed suites (differential + UI e2e). These are deliberately
# excluded from push and pull-request CI: Winnow itself is a direct-P2P client,
# and ordinary development must not depend on a bitcoind running on an owner's
# workstation. Enable this workflow only after provisioning a dedicated runner
# with the `node-e2e` label and its own disposable custom-signet fixture.
#
# Node location is configurable via repository VARIABLES (not secrets) —
# unset variables fall back to the local-dev defaults:
#   WINNOW_NODE_HOST (default 127.0.0.1)
#   WINNOW_P2P_PORT  (default 38401)
#   WINNOW_RPC_PORT  (default 38400)
#   WINNOW_DATADIR is always an ephemeral client-only directory. The runner's
#   BTC_SWIFT_DATADIR variable is probed only to document the fixture location.
# The "Node reachability probe" step reports which of these the runners can
# actually reach. Note: `xcodebuild test` does not forward its environment
# into the iOS-simulator test runner, so the UI suite gets these values via
# ~/.winnow-node.env (written by the "simulator test config" step).

on:
  workflow_dispatch:
    inputs:
      confirm_dedicated_fixture:
        description: Run against the dedicated, disposable node-e2e fixture
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: node-tests
  cancel-in-progress: false

jobs:
  node-tests:
    if: inputs.confirm_dedicated_fixture
    # The extra label prevents this workload from falling back to a developer
    # workstation or either of the general-purpose btc-swift runners.
    runs-on: [self-hosted, macOS, btc-swift, node-e2e]
    timeout-minutes: 90
    env:
      WINNOW_NODE_HOST: ${{ vars.BTC_SWIFT_NODE_HOST || '127.0.0.1' }}
      WINNOW_P2P_PORT: ${{ vars.BTC_SWIFT_P2P_PORT || '38401' }}
      WINNOW_RPC_PORT: ${{ vars.BTC_SWIFT_RPC_PORT || '38400' }}
      WINNOW_FIXTURE_DATADIR: ${{ vars.BTC_SWIFT_DATADIR || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Runner environment probe
        run: |
          echo "== uname =="; uname -a
          sw_vers
          echo "== Xcode =="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "no /Applications/Xcode*.app"
          echo "xcode-select: $(xcode-select -p 2>&1)"
          echo "== swift =="
          (which swift && swift --version) 2>&1 || echo "no swift"
          echo "== brew =="
          (which brew && brew --version | head -1) 2>&1 || echo "no brew"
          echo "== bitcoin-cli =="
          (which bitcoin-cli && bitcoin-cli --version | head -1) 2>&1 \
            || ls /usr/local/bin/bitcoin-cli /opt/homebrew/bin/bitcoin-cli 2>/dev/null \
            || echo "no bitcoin-cli"
          echo "== datadir =="
          ls -d "${WINNOW_FIXTURE_DATADIR:-$HOME/.bitcoin-mysignet}" 2>/dev/null || echo "no fixture datadir visible on this runner"
          echo "== home =="; echo "$HOME"

      - name: Node reachability probe
        run: |
          echo "P2P $WINNOW_NODE_HOST:$WINNOW_P2P_PORT"
          nc -z -G 5 "$WINNOW_NODE_HOST" "$WINNOW_P2P_PORT" && echo "P2P REACHABLE" || echo "P2P UNREACHABLE"
          echo "RPC $WINNOW_NODE_HOST:$WINNOW_RPC_PORT"
          nc -z -G 5 "$WINNOW_NODE_HOST" "$WINNOW_RPC_PORT" && echo "RPC REACHABLE" || echo "RPC UNREACHABLE"

      - name: Install pinned XcodeGen
        run: scripts/install-xcodegen

      - name: Require pre-provisioned bitcoin-cli
        run: |
          which bitcoin-cli >/dev/null || {
            echo "::error::the dedicated node-e2e runner must pre-provision bitcoin-cli"
            exit 1
          }

      - name: Materialize fixed node RPC credential
        # BTC_SWIFT_RPC_COOKIE keeps its historical name, but its value is the
        # dedicated winnow-ci username:password backed by rpcauth on the node.
        # Writing it as a cookie file lets bitcoin-cli consume the credential
        # without putting it on the command line. It survives node restarts.
        env:
          WINNOW_RPC_AUTH: ${{ secrets.BTC_SWIFT_RPC_COOKIE }}
        run: |
          case "$WINNOW_RPC_AUTH" in
            winnow-ci:*) ;;
            *) echo "::error::BTC_SWIFT_RPC_COOKIE must contain the fixed winnow-ci rpcauth credential"; exit 1 ;;
          esac
          DD="$RUNNER_TEMP/winnow-node-client"
          printf 'WINNOW_DATADIR=%s\n' "$DD" >> "$GITHUB_ENV"
          mkdir -p "$DD/signet"
          # bitcoin-cli derives the chain from the conf file; without it the
          # CLI assumes mainnet and looks for $DD/.cookie instead of
          # $DD/signet/.cookie — write both plus a minimal conf.
          printf 'signet=1\nserver=1\n' > "$DD/bitcoin.conf"
          printf '%s' "$WINNOW_RPC_AUTH" > "$DD/.cookie"
          printf '%s' "$WINNOW_RPC_AUTH" > "$DD/signet/.cookie"
          chmod 600 "$DD/.cookie" "$DD/signet/.cookie"

      - name: Locate developer tools
        id: devtools
        run: |
          test -d /Applications/Xcode.app/Contents/Developer || {
            echo "::error::the dedicated node-e2e runner is missing /Applications/Xcode.app"
            exit 1
          }
          echo "devdir=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_OUTPUT"

      - name: Swift package tests
        env:
          DEVELOPER_DIR: ${{ steps.devtools.outputs.devdir }}
        run: swift test

      - name: Differential suite (WINNOW_DIFF=1, node-backed)
        env:
          DEVELOPER_DIR: ${{ steps.devtools.outputs.devdir }}
          WINNOW_DIFF: "1"
        # --no-parallel is required, not tidiness. Two suites mine onto the
        # same tip (FullLoopDiffTests and VaultInteropDiffTests); run
        # concurrently they race for every block, each re-mines on the winner,
        # and the run stalls indefinitely rather than failing.
        run: swift test --filter DifferentialTests --no-parallel

      - name: Generate Xcode project
        run: xcodegen

      - name: Ensure an iPhone simulator exists
        id: sim
        run: |
          NAME=""
          for TYPE in "iPhone 17" "iPhone 16" "iPhone 15"; do
            if xcrun simctl list devices available | grep -q "$TYPE ("; then NAME="$TYPE"; break; fi
          done
          if [ -z "$NAME" ]; then
            # Create one (simctl picks the newest iOS runtime by default).
            for TYPE in "iPhone 17" "iPhone 16" "iPhone 15"; do
              if xcrun simctl create "$TYPE" "$TYPE" >/dev/null 2>&1; then NAME="$TYPE"; break; fi
            done
          fi
          if [ -z "$NAME" ]; then
            echo "::error::the dedicated node-e2e runner has no usable iPhone simulator/runtime"
            exit 1
          fi
          echo "simulator: $NAME"
          echo "sim-name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Simulator test config (env file + screenshots symlink)
        run: |
          # xcodebuild does not forward its environment into the iOS-simulator
          # test runner; UITests/BitcoinCLI.swift reads this file instead.
          {
            echo "WINNOW_NODE_HOST=$WINNOW_NODE_HOST"
            echo "WINNOW_P2P_PORT=$WINNOW_P2P_PORT"
            echo "WINNOW_RPC_PORT=$WINNOW_RPC_PORT"
            [ -n "$WINNOW_DATADIR" ] && echo "WINNOW_DATADIR=$WINNOW_DATADIR"
          } > "$HOME/.winnow-node.env"
          # The suite's default screenshot dir is $HOME/src/btc-swift/docs/
          # screenshots — symlink it into the checkout so the artifact
          # upload below finds the PNGs (WINNOW_SCREENSHOT_DIR does not
          # reach the sim runner either).
          mkdir -p "$HOME/src/btc-swift/docs"
          ln -sfn "$GITHUB_WORKSPACE/docs/screenshots" "$HOME/src/btc-swift/docs/screenshots"

      - name: Shut down stale simulators before the UI leg
        # Belt to the cleanup step's braces, for the one path that step cannot
        # cover: if the runner process dies hard its `always()` steps never
        # run, and the orphan outlives the job with nothing left to kill it.
        # Scope honestly: this clears orphans on THIS runner only. The one that
        # cost run 31995843360 its 37 lost races was on the other VM and
        # competed over the chain, not locally — this step would not have
        # helped there.
        run: |
          xcrun simctl shutdown all || true
          pkill -f WinnowAppUITests-Runner || true

      - name: UI tests (e2e on the signet node, screenshot capture)
        env:
          DEVELOPER_DIR: ${{ steps.devtools.outputs.devdir }}
        run: >-
          xcodebuild test -project WinnowApp.xcodeproj -scheme WinnowApp
          -destination 'platform=iOS Simulator,name=${{ steps.sim.outputs.sim-name }}'
          -skipPackagePluginValidation -skipMacroValidation

      - name: Kill the simulator test runner (issue #35)
        # Killing `xcodebuild` does NOT stop the tests. The XCUITest runner and
        # the app under test live under `launchd_sim` inside the launchd-owned
        # CoreSimulator services, not under `xcodebuild`, so the runner's kill
        # misses them — and UITests/ mines from the test-runner process.
        #
        # Run 31995801162 (main, cancelled at 06:20:24Z on 2026-08-17) is the
        # evidence: its UI leg kept mining for 54 more minutes, to 07:14:21Z,
        # completing test02's full 101-block funding loop. The gap in the chain
        # spanning the kill is 15s (h8346 06:20:18 -> h8347 06:20:33) against a
        # ~50s mean, which is why this is continuation and not a restart. Those
        # blocks then contended with the NEXT run's differential leg: 54 blocks
        # inside 31995843360's step 10, 37 lost races out of 138 draws.
        #
        # `always()` is load-bearing — the whole point is the paths where the
        # step above did not finish. It is also observed to work in exactly
        # this failure mode: on 31995801162 the (also-`always()`) upload step
        # ran to success at 06:20:08-09, seconds after the UI step was
        # cancelled. A step-level `timeout-minutes` would NOT fix this: same
        # kill path, same orphan.
        if: always()
        run: |
          xcrun simctl shutdown all || true
          pkill -f WinnowAppUITests-Runner || true

      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-screenshots
          # The sim-runner config step symlinked the suite's default
          # screenshot dir into the checkout.
          path: |
            docs/screenshots/*.png
            docs/screenshots/timings.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove runner credentials and test configuration
        if: always()
        run: |
          DD="$RUNNER_TEMP/winnow-node-client"
          rm -f "$DD/.cookie" "$DD/signet/.cookie" "$DD/bitcoin.conf"
          rmdir "$DD/signet" "$DD" 2>/dev/null || true
          rm -f "$HOME/.winnow-node.env" "$HOME/src/btc-swift/docs/screenshots"
