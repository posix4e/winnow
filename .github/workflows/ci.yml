name: CI

# Webpage-only changes skip this workflow. They run Site instead:
# .github/workflows/site.yml — checkout + Cloudflare Pages, no Swift/Xcode.
#
# This cannot be a blanket "docs/**". project.yml bundles six files from docs/
# into the app as resources — site.css and the five design papers — so editing
# or renaming one of those has to build. They are deliberately absent below.
# Keep this list in step with the resources block in project.yml.
#
# A deny list fails safe: a page added later is not listed, so it runs CI
# (slow but correct) rather than silently skipping it.
on:
  push:
    branches: [main]
    paths-ignore: &site-only
      - "docs/index.html"
      - "docs/present.html"
      - "docs/architecture.html"
      - "docs/papers.html"
      - "docs/custody.html"
      - "docs/evidence.html"
      - "docs/privacy.html"
      - "docs/paper.md"
      - ".github/internal/**"
      - "docs/screenshots/**"
      - "docs/og.png"
      - "docs/present-qr.png"
      - ".github/workflows/site.yml"
      - ".github/agent-handoff.md"
  pull_request:
    paths-ignore: *site-only

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Runs for every event, including pull requests from forks, so it is
  # GitHub-hosted and ephemeral. A fork pull request is untrusted code, and
  # this repository is public: running it on the persistent self-hosted runner
  # put attacker-controlled code on a long-lived host that reaches the owner's
  # network (SEC-005, #128). The exposure was credential and lateral-movement
  # risk rather than a bad build, and no secret was needed to realise it.
  #
  # Nothing is lost by hosting it. The package suite needs no local node —
  # DifferentialTests and the signet suites are gated behind WINNOW_DIFF and
  # WINNOW_SIGNET, which are set nowhere in this workflow, and the signet
  # suites dial loopback in any case. macos-latest is also measurably faster
  # than the self-hosted VMs for this job.
  #
  # This job is unconditional on purpose: a fork pull request must not be able
  # to pass by skipping it, which is what a same-repository `if:` would do.
  package-tests:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Swift package tests (176+ BIP vector + unit + loopback)
        run: swift test
        # Env-gated suites (DifferentialTests, signet integration) skip
        # cleanly without WINNOW_DIFF/WINNOW_SIGNET and no local node.

  # The self-hosted runners are x86_64 and macos-latest is arm64, so hosting
  # the job above would silently drop Intel coverage of the package suite.
  # This keeps it, on trusted events only: a `push` to main runs code that is
  # already in the repository. It never runs on `pull_request`, so fork code
  # cannot reach the persistent host.
  package-tests-intel:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, macos, x86_64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Swift package tests on x86_64
        run: swift test

  app-build:
    # GitHub-hosted: the self-hosted VMs are CLT-only for now (no Xcode.app).
    # Move back to [self-hosted, macos, x86_64] once the VMs have full Xcode.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned XcodeGen
        run: scripts/install-xcodegen
      - name: Generate Xcode project
        run: xcodegen
      - name: Build app (iOS Simulator)
        run: >-
          xcodebuild -project WinnowApp.xcodeproj -scheme WinnowApp
          -destination 'generic/platform=iOS Simulator'
          -skipPackagePluginValidation -skipMacroValidation build
      - name: App unit tests (required)
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available -j | ruby -rjson -e '
            json = JSON.parse(STDIN.read)
            runtimes = json.fetch("devices").keys.grep(/\.iOS-/).sort.reverse
            device = runtimes.lazy.flat_map { |runtime| json["devices"][runtime] }
              .find { |entry| entry["isAvailable"] && entry["name"].start_with?("iPhone") }
            abort "no available iPhone simulator" unless device
            puts device.fetch("udid")
          ')"
          test -n "$SIMULATOR_ID"
          xcodebuild test -project WinnowApp.xcodeproj -scheme WinnowApp \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -only-testing:WinnowAppTests \
            -skipPackagePluginValidation -skipMacroValidation
      - name: Build and inspect release app
        run: |
          xcodebuild -project WinnowApp.xcodeproj -scheme WinnowApp \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/winnow-release" \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build
          scripts/verify-release-e2e-exclusion \
            "$RUNNER_TEMP/winnow-release/Build/Products/Release-iphonesimulator/WinnowApp.app"
