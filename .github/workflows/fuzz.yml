name: Fuzz

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      replay_seed:
        description: Seed from a previous run; blank rotates the corpus
        type: string
        required: false

permissions:
  contents: read

jobs:
  # The development harness exercises the local Bitcoin modules. Deliberately
  # a FIXED seed, unlike the sustained job. This is the regression evidence:
  # every pull request fuzzes the identical 14,000 cases, so a newly
  # introduced parser bug shows up as this check turning red rather than as a
  # corpus that happened to wander somewhere new. Rotation belongs in the
  # sustained job; do not "fix" this one too.
  smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 30
    concurrency:
      group: fuzz-smoke-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bounded deterministic fuzz smoke
        env:
          FUZZ_DIR: ${{ runner.temp }}/winnow-fuzz-smoke
        run: |
          mkdir -p "$FUZZ_DIR"
          set -o pipefail
          swift run \
            --configuration release WinnowFuzz \
            --iterations 1000 \
            --seed 0x57494e4e4f575055 \
            --max-input 16384 \
            --artifact-dir "$FUZZ_DIR" \
            2>&1 | tee "$FUZZ_DIR/run.log"

      - name: Upload fuzz log and reproducer
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/winnow-fuzz-smoke/
          if-no-files-found: warn
          retention-days: 7

  sustained-fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    concurrency:
      group: fuzz-${{ github.ref }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        # `offset` separates the two legs. Both derive their seed from the same
        # run id, so without it address and thread would fuzz an identical
        # sequence and the second sanitizer would add nothing (SEC-017, #130).
        include:
          - sanitizer: address
            offset: 1
          - sanitizer: thread
            offset: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sustained deterministic fuzz under ${{ matrix.sanitizer }} sanitizer
        env:
          FUZZ_DIR: ${{ runner.temp }}/winnow-fuzz-${{ matrix.sanitizer }}
          # A constant seed made every weekly run repeat the same 25,000 cases,
          # so the schedule bought no new coverage after its first execution.
          # The run id rotates the corpus while keeping any failure exactly
          # reproducible from a number recorded in the artifact. `replay_seed`
          # overrides it for a manual dispatch, which is how a failure found
          # here is re-run locally.
          #
          # A re-run of a failed run reuses its run id by design: the point of
          # a re-run is to reproduce, not to fuzz something new.
          RESOLVED_SEED: ${{ inputs.replay_seed || format('{0}{1}', github.run_id, matrix.offset) }}
        run: |
          mkdir -p "$FUZZ_DIR"
          # Written before the run, not after: a 60-minute timeout or a hard
          # kill leaves no stdout, and `if: always()` would then upload an
          # artifact that cannot say what it was fuzzing.
          printf '%s\n' "$RESOLVED_SEED" > "$FUZZ_DIR/seed.txt"
          echo "sustained fuzz: sanitizer=${{ matrix.sanitizer }} seed=$RESOLVED_SEED"
          set -o pipefail
          swift run \
            --configuration release --sanitize "${{ matrix.sanitizer }}" WinnowFuzz \
            --iterations 25000 \
            --seed "$RESOLVED_SEED" \
            --max-input 65536 \
            --artifact-dir "$FUZZ_DIR" \
            2>&1 | tee "$FUZZ_DIR/run.log"

      - name: Upload sanitizer log and reproducer
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.sanitizer }}-${{ github.run_id }}
          path: ${{ runner.temp }}/winnow-fuzz-${{ matrix.sanitizer }}/
          if-no-files-found: warn
          retention-days: 14
